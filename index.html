<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Notas Fiscais</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div>
            <h1>Controle de Notas Fiscais</h1>
            <p>Acompanhamento interno</p>
        </div>
    </header>

    <main>

        <!-- RESUMO -->
        <section class="resumo">
            <div class="card">
                <span>Total de NFs</span>
                <strong id="totalNFs">0</strong>
            </div>

            <div class="card">
                <span>Pendentes</span>
                <strong id="totalPendentes">0</strong>
            </div>

            <div class="card">
                <span>Aprovadas</span>
                <strong id="totalAprovadas">0</strong>
            </div>

            <div class="card">
                <span>Valor total</span>
                <strong id="valorTotal">R$ 0,00</strong>
            </div>
        </section>


        <!-- CADASTRO -->
        <section class="painel">

            <h2>Nova nota fiscal</h2>

            <form id="formNF">

                <div class="campo">
                    <label for="numero">Número da NF</label>
                    <input type="text" id="numero" placeholder="Ex.: 123456" required>
                </div>

                <div class="campo">
                    <label for="fornecedor">Fornecedor</label>
                    <input type="text" id="fornecedor" placeholder="Nome do fornecedor" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" step="0.01" min="0" placeholder="0,00" required>
                </div>

                <div class="campo">
                    <label for="data">Data</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo campo-grande">
                    <label for="observacao">Observação</label>
                    <input type="text" id="observacao" placeholder="Alguma informação adicional">
                </div>

                <button type="submit" class="btn-principal">
                    + Adicionar NF
                </button>

            </form>

        </section>


        <!-- FILTROS -->
        <section class="painel">

            <div class="cabecalho-tabela">

                <div>
                    <h2>Notas fiscais</h2>
                    <p>Consulte e atualize o status das notas.</p>
                </div>

                <div class="filtros">

                    <input
                        type="text"
                        id="busca"
                        placeholder="🔎 Buscar NF ou fornecedor..."
                    >

                    <select id="filtroStatus">
                        <option value="Todos">Todos os status</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Em análise">Em análise</option>
                        <option value="Aprovada">Aprovada</option>
                        <option value="Paga">Paga</option>
                        <option value="Cancelada">Cancelada</option>
                    </select>

                </div>

            </div>


            <!-- TABELA -->
            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>NF</th>
                            <th>Fornecedor</th>
                            <th>Valor</th>
                            <th>Data</th>
                            <th>Observação</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaNFs">
                    </tbody>

                </table>

            </div>

            <div id="semResultados" class="sem-resultados">
                Nenhuma nota fiscal encontrada.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
